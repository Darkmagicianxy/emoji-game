<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emoji Game 🎮</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eafaf1; /* light green */
      color: #155724; /* deep green text */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #6a1b9a; /* purple */
    }

    #emojis {
      font-size: 2.5rem;
      margin: 1rem 0;
      word-break: break-word;
    }

    button, a.share-btn {
      padding: 10px 16px;
      font-size: 1rem;
      margin: 8px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(to right, #4CAF50, #9c27b0); /* green to purple gradient */
      color: white;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      transition: background 0.3s ease;
    }

    button:hover, a.share-btn:hover {
      background: linear-gradient(to right, #388e3c, #7b1fa2); /* darker gradient on hover */
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>🎉 Random Emoji Game 🎉</h1>
  <div id="emojis">Click below to play!</div>
  <button onclick="generateEmojis()">Get Emojis</button>

  <div class="share-buttons">
    <a class="share-btn" id="whatsapp" target="_blank">WhatsApp</a>
    <a class="share-btn" id="telegram" target="_blank">Telegram</a>
    <a class="share-btn" id="snapchat" target="_blank">Snapchat</a>
    <button onclick="copyEmojis()">Copy Emojis</button>
    <button onclick="downloadImage()">Download as Image</button>
  </div>

  <script>
    const emojiList = Array.from({ length: 0x1FAF0 - 0x1F300 }, (_, i) => {
      const emoji = String.fromCodePoint(0x1F300 + i);
      return /\p{Emoji}/u.test(emoji) ? emoji : null;
    }).filter(Boolean);

    function generateEmojis() {
      let result = [];
      while (result.length < 10) {
        const random = emojiList[Math.floor(Math.random() * emojiList.length)];
        if (!result.includes(random)) result.push(random);
      }
      const emojiStr = result.join(" ");
      document.getElementById("emojis").innerText = emojiStr;

      const shareText = encodeURIComponent(`🎮 Try this fun emoji game! 😄\n${emojiStr}\n👉 https://darkmagicianxy.github.io/emoji-game/`);
      document.getElementById("whatsapp").href = `https://wa.me/?text=${shareText}`;
      document.getElementById("telegram").href = `https://t.me/share/url?url=https://darkmagicianxy.github.io/emoji-game/&text=${shareText}`;
      document.getElementById("snapchat").href = `https://www.snapchat.com/scan?attachmentUrl=https://darkmagicianxy.github.io/emoji-game/`;
    }

    function copyEmojis() {
      const emojis = document.getElementById("emojis").innerText;
      navigator.clipboard.writeText(emojis).then(() => {
        alert("Emojis copied to clipboard! 😎");
      }).catch((err) => {
        alert("Failed to copy emojis: " + err);
      });
    }

    function downloadImage() {
      const emojis = document.getElementById("emojis").innerText;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = 500;
      canvas.height = 150;
      ctx.font = "36px Arial";
      ctx.fillText(emojis, 10, 50);

      const dataUrl = canvas.toDataURL("image/png");

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "emoji_game.png";
      link.click();
    }
  </script>
</body>
</html>
